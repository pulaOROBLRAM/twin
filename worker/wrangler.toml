name = "twin-worker"
main = "src/index.ts"
compatibility_date = "2024-03-20"

[[r2_buckets]]
binding = "MEMORY_BUCKET"
bucket_name = "twin-memory"

# Local dev will read worker/.env for this variable.
# For production, set the secret with: wrangler secret put GEMINI_API_KEY
[vars]
GEMINI_API_KEY = "$GEMINI_API_KEY"
